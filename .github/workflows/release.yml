name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build all workspaces
        run: npm run build

  package-artifacts:
    name: Package Build Artifacts
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension and backend
        run: |
          npm run build --workspace @jobpilot/extension
          npm run build --workspace @jobpilot/backend

      - name: Create release artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          EXT_ZIP="jobpilot-extension-${VERSION}.zip"
          API_TAR="jobpilot-backend-${VERSION}.tar.gz"

          cd apps/extension/dist
          zip -r "../../../${EXT_ZIP}" .
          cd ../../..

          tar -czf "${API_TAR}" -C apps/backend dist package.json

          echo "EXT_ZIP=${EXT_ZIP}" >> "$GITHUB_ENV"
          echo "API_TAR=${API_TAR}" >> "$GITHUB_ENV"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.ref_name }}
          path: ${{ env.EXT_ZIP }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.ref_name }}
          path: ${{ env.API_TAR }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package-artifacts
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-${{ github.ref_name }}

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jobpilot-extension-${{ github.ref_name }}.zip
            jobpilot-backend-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
